name: build

# Every push: test and build both apps (as workflow artifacts).
# A tag like v1.2.3: the same, with that version built in, plus the Windows installer,
# published as a release of this repo. The installed apps look there for updates
# (update.go).
# macOS runners can wait a long time for a machine, so the release does not wait for
# the Mac: it is published with the Windows installer, and the Mac job adds its zip to
# it when it is done.

# The name in the Actions list: "Release v1.2.3" for a tag, "Build main" for a push,
# "PR #12" for a pull request (by default GitHub shows the last commit's message).
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number)
  || startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name)
  || format('Build {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: go vet ./... && GOOS=windows go vet ./... && go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Version
        shell: bash
        run: |
          v=dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=${GITHUB_REF#refs/tags/v}
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tags must look like v1.2.3, not v$v"; exit 1; }
            jq --arg v "$v" '.info.productVersion = $v' wails.json > wails.tmp && mv wails.tmp wails.json
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: wails build -platform windows/amd64 -skipbindings -m -nosyncgomod -ldflags "-X main.version=${{ env.VERSION }}"
      - name: Installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          & $nsis /V2 "/DVERSION=$env:VERSION" scripts\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ruben-term-windows
          path: |
            build/bin/ruben-term.exe
            build/bin/ruben-term-*-setup.exe

  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Version
        run: |
          v=dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=${GITHUB_REF#refs/tags/v}
            jq --arg v "$v" '.info.productVersion = $v' wails.json > wails.tmp && mv wails.tmp wails.json
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: wails build -platform darwin/universal -skipbindings -m -nosyncgomod -ldflags "-X main.version=${{ env.VERSION }}"
      - run: go test ./...
      - run: ditto -c -k --keepParent build/bin/ruben-term.app ruben-term-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ruben-term-mac
          path: ruben-term-mac.zip
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # the release job creates the release; wait for it (up to 20 minutes)
          for i in $(seq 40); do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber ruben-term-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ruben-term-windows
          path: dist
      - name: Release notes
        run: |
          tag=${GITHUB_REF#refs/tags/}
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            git log --no-merges --pretty='- %s' ${prev:+$prev..}$tag
            echo
            echo "**Windows:** download \`ruben-term-${tag#v}-setup.exe\` and open it."
            echo "**macOS:** download \`ruben-term-mac.zip\` (added a few minutes after the release), unzip it and drag ruben-term to Applications."
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "ruben-term ${tag#v}" --notes-file notes.md \
            dist/ruben-term-*-setup.exe
